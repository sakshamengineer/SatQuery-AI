[project]
name = "aeris"
version = "0.1.0"
description = "AERIS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "peft",
    "datasets",
    "huggingface-hub",
    "qwen-vl-utils",
    "rasterio",
    "numpy",
    "pandas",
    "scikit-learn",
    "opencv-python",
    "Pillow",
    "matplotlib",
    "geopandas",
    "shapely",
    "pyproj",
    "requests",
    "python-dotenv",
    "bitsandbytes>=0.46.1",
]

[tool.vercel]
entrypoint = "Backend.main:app"